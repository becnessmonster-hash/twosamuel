<!DOCTYPE html>

<title>Countdown</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff}
body{display:flex;align-items:center;justify-content:center;font-family:ui-monospace,Menlo,Consolas,monospace}
#w{display:flex;flex-direction:column;gap:12px}
form{display:flex;gap:8px;align-items:center}
input,button{font:inherit;font-size:16px;background:#000;color:#fff;border:1px solid #444;padding:10px 14px;outline:none;border-radius:0}
input:focus{border-color:#fff}
button{cursor:pointer}button:hover{border-color:#fff}
.bad input{border-color:#600}
.tick{width:28px;color:#2ecc40;font-size:24px;visibility:hidden}
.ok .tick{visibility:visible}
.ok input{border-color:#2ecc40}
#emblem{display:block;margin:0 auto 8px;max-width:160px;max-height:160px;opacity:0;transform:scale(.8);transition:opacity .6s,transform .6s;visibility:hidden}
#emblem.show{opacity:1;transform:scale(1);visibility:visible}

</div>

function u(s){return Uint8Array.from(atob(s),function(ch){return ch.charCodeAt(0)})}
async function open(pass,X){
 var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
 var key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(X[0]),iterations:250000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
 return new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:u(X[1])},key,u(X[2])));
}
function fail(f,i){f.classList.add('bad');i.value='';setTimeout(function(){f.classList.remove('bad')},800)}

 catch(err){fail(f1,p1)}
});

 try{
